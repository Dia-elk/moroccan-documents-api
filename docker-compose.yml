services:
  postgres:
    image: postgres:16-alpine
    container_name: morocco-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-morocco_docs}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - morocco_docs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-morocco_docs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: morocco-docs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-morocco_docs}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  morocco_docs_data:
